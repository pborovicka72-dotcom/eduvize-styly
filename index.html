<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eduvize | Správa stylů</title><style>
:root{font-family:system-ui,sans-serif;color:#142c46;background:#edf5fa}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:32px}h1{font-size:38px;margin:8px 0}p{color:#536a7e}.layout{display:grid;grid-template-columns:300px 1fr;gap:24px}.panel{background:white;border:1px solid #d1e6e5;border-radius:20px;padding:24px;margin-top:22px}.preset{width:100%;display:flex;align-items:center;gap:12px;background:white;border:2px solid #d1e6e5;border-radius:12px;padding:12px;margin:9px 0;cursor:pointer;text-align:left}.preset[aria-pressed=true]{border-color:#0876bb;background:#eef8fc}.swatch{width:55px;height:45px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:3px solid var(--edge);background:var(--bg)}.swatch:after{content:'';width:26px;height:18px;border-radius:5px;background:var(--tile);border:3px solid var(--accent)}label{display:block;font-weight:650;margin:14px 0}input{width:100%;padding:9px;margin-top:6px;border:1px solid #bcd1df;border-radius:9px}input[type=color]{height:46px;padding:3px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}button{border:0;border-radius:10px;padding:12px 16px;background:#0876bb;color:white;font-weight:700;cursor:pointer;margin:5px}button:disabled{opacity:.4;cursor:not-allowed}.preview{padding:16px;border:6px solid var(--edge);border-radius:var(--radius);background:var(--bg);color:var(--text)}.preview header{padding:16px;border-radius:12px;background:var(--accent);color:white;font-size:25px;font-weight:800}.preview section{margin-top:12px;padding:24px;border-radius:12px;background:var(--tile);border:2px solid var(--edge)}@media(max-width:750px){.layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
</style></head><body><main><p>EDUVIZE · SYSTÉMOVÁ APLIKACE</p><h1>Správa stylů</h1><p>Uložené předvolby vzhledu. Výchozí styl je chráněný. Změny se ukládají v tomto prohlížeči; centrální synchronizace zatím není aktivní.</p><div class="layout"><aside class="panel"><h2>Uložené styly</h2><div id="presets"></div><button id="new">Kopírovat jako nový</button><button id="remove">Odstranit</button></aside><div><div class="panel"><h2>Parametry stylu <span id="dirty"></span></h2><label>Název<input id="name"></label><div class="fields"><label>Pozadí<input type="color" id="bg"></label><label>Dlaždice<input type="color" id="tile"></label><label>Hlavička / akcent<input type="color" id="accent"></label><label>Rámeček<input type="color" id="edge"></label><label>Text<input type="color" id="text"></label><label>Zaoblení (px)<input type="number" min="0" max="80" id="radius"></label></div><button id="save">Uložit změny</button></div><div class="panel"><h2>Náhled</h2><div class="preview" id="preview"><header>Eduvize · Náhled stylu</header><section>Ukázková dlaždice aplikace</section></div></div></div></div></main><script>
const KEY='eduvize-styles-v1',base={id:'default',name:'Výchozí styl',bg:'#edf5fa',tile:'#ffffff',accent:'#0876bb',edge:'#b7e7f4',text:'#142c46',radius:20};let custom=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))custom=v.filter(x=>x.id!=='default')}catch{}let selected='default',draft={...base},dirty=false;const $=id=>document.getElementById(id),fields=['name','bg','tile','accent','edge','text','radius'];const all=()=>[base,...custom],current=()=>all().find(x=>x.id===selected)||base;function paint(){fields.forEach(k=>$(k).value=draft[k]);$('preview').style.cssText='--bg:'+draft.bg+';--tile:'+draft.tile+';--accent:'+draft.accent+';--edge:'+draft.edge+';--text:'+draft.text+';--radius:'+draft.radius+'px';$('dirty').textContent=dirty?'· Neuložené změny':'';$('save').disabled=selected==='default'||!dirty;$('remove').disabled=selected==='default';$('name').disabled=selected==='default';for(const k of fields.filter(x=>x!=='name'))$(k).disabled=selected==='default';$('presets').replaceChildren();all().forEach(s=>{const b=document.createElement('button');b.className='preset';b.setAttribute('aria-pressed',String(s.id===selected));const sw=document.createElement('span');sw.className='swatch';sw.style.cssText='--bg:'+s.bg+';--tile:'+s.tile+';--accent:'+s.accent+';--edge:'+s.edge;const t=document.createElement('span');t.textContent=s.name+(s.id==='default'?' · chráněný':'');b.append(sw,t);b.onclick=()=>choose(s.id);$('presets').append(b)})}function confirmDiscard(){return !dirty||confirm('Máte neuložené změny. Opravdu je zahodit?')}function choose(id){if(!confirmDiscard())return;selected=id;draft={...current()};dirty=false;paint()}function persist(){localStorage.setItem(KEY,JSON.stringify(custom))}fields.forEach(k=>$(k).addEventListener('input',()=>{draft[k]=k==='radius'?Number($(k).value):$(k).value;dirty=JSON.stringify(draft)!==JSON.stringify(current());paint()}));$('new').onclick=()=>{if(!confirmDiscard())return;const s={...draft,id:'style-'+Date.now(),name:'Nový styl'};custom.push(s);persist();selected=s.id;draft={...s};dirty=false;paint()};$('save').onclick=()=>{if(selected==='default')return;const i=custom.findIndex(x=>x.id===selected);if(i<0)return;custom[i]={...draft};persist();dirty=false;paint()};$('remove').onclick=()=>{if(selected==='default'||!confirm('Odstranit tento styl?'))return;custom=custom.filter(x=>x.id!==selected);persist();selected='default';draft={...base};dirty=false;paint()};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});paint();
</script></body></html>
