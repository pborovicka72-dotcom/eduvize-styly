services:
  - type: web
    name: eduvize-design-system-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DESIGN_SYSTEM_ADMIN_TOKEN
        sync: false
