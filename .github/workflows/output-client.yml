name: Shared output client v1
on:
  pull_request:
  push:
    branches: [feat/shared-output-client-v1]
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node design-system/tests/output-api-client.test.cjs
      - run: node design-system/tests/output-runtime-recovery.test.cjs
      - run: node --test design-system/tests/output-items-client.test.cjs design-system/tests/output-gated-auth.test.cjs
      - run: node tests/link-contract.test.cjs
      - run: node design-system/tests/broadcast-license.test.cjs

      - name: Global brand upload controls and logo replacement
        run: node --test design-system/tests/branding-upload.test.cjs design-system/tests/branding-runtime.test.cjs

      - name: Stable section paging and real-browser card measurement
        run: node design-system/tests/section-pager-stability.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: NSP 6/4 resize history and paging regression
        run: python design-system/tests/section-pager-browser.py
