name: Publish static compatibility pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/configure-pages@v5
      - name: Validate shared frontend contract
        run: |
          python3 scripts/audit_frontend.py
          node design-system/tests/shared-loading.test.cjs
      - name: Copy public assets only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('_site')
          target.mkdir()
          for name in ['index.html','aplikace.html','ucet.html','licence.html','editor.html']:
              shutil.copyfile(name,target/name)
          for name in ['design-system','experimental','fotogalerie']:
              shutil.copytree(name,target/name)
          (target/'.nojekyll').touch()
          assert not (target/'vendor').exists()
          assert not (target/'app.py').exists()
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
