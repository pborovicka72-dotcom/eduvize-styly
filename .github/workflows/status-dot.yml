name: Shared status dot geometry
on:
  pull_request:
  push:
    branches: [fix/status-dot-message-inset]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python design-system/tests/status-dot-inset-browser.py
