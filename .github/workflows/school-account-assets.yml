name: Source-owned school registry
on:
  pull_request:
    paths:
      - 'experimental/**'
      - 'ucet.html'
      - 'scripts/check_school_registry.py'
      - '.github/workflows/school-account-assets.yml'
  push:
    branches: [main]
    paths:
      - 'experimental/**'
      - 'ucet.html'
      - 'scripts/check_school_registry.py'
      - '.github/workflows/school-account-assets.yml'
permissions:
  contents: read
jobs:
  school-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_school_registry.py
      - name: Explain canonical behavior coverage
        run: echo 'School-card and full static-assembly regressions run in eduvize-admin Canonical static publication against pinned generated sources.'
