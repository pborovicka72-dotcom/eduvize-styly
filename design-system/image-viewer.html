<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obrázek</title><link rel="stylesheet" href="document-viewport.css?v=3"><script defer src="active-theme.js?v=14"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ev-bg,#fff);font-family:system-ui,sans-serif}#viewer{height:100dvh}#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ev-bg,#fff);color:var(--ev-text,#153a53);z-index:2}#loading[hidden]{display:none}</style></head><body><div id="loading" role="status">Načítám obrázek…</div><main id="viewer"></main><script src="document-viewport.js?v=4"></script><script>const loading=document.getElementById('loading');try{const url=new URL(new URLSearchParams(location.search).get('src'));if(!['https:','http:'].includes(url.protocol))throw Error('Neplatný odkaz');window.EduvizeDocumentViewport.mountImage(document.getElementById('viewer'),url.href,{onReady:()=>loading.hidden=true,onError:()=>loading.hidden=true});}catch{loading.textContent='Odkaz na obrázek není platný.'}</script></body></html>
